[workspace]
resolver = "2"
members = [
    "crates/bitmule",
    "crates/bitmule-core",
    "crates/bitmule-crypto",
    "crates/bitmule-server",
    "crates/bitmule-server-signal-ws",
    "crates/bitmule-server-store-fs",
    "crates/bitmule-client-wasm",
    "crates/bitmule-client-native",
    "crates/bitmule-e2e-tests",
    "crates/bitmule-qt6",
    "crates/bitmule-gtk4",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Sebastian K. <s3bk@qdat.net>", "Kenna <kenna@isecom.org>"]
repository = "https://github.com/s3bk/bitmule"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
rand_core = { version = "0.6", features = ["std"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
blake3 = "1"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tokio-tungstenite = "0.24"
roaring = "0.10"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
