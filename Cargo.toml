[workspace]
resolver = "2"
members = [
    "crates/bitmule",
    "crates/bitmule-core",
    "crates/bitmule-buf",
    "crates/bitmule-crypto",
    "crates/bitmule-server",
    "crates/bitmule-server-signal-ws",
    "crates/bitmule-client-wasm",
    "crates/bitmule-client-native",
    "crates/bitmule-e2e-tests",
    "crates/bitmule-qt6",
    "crates/bitmule-gtk4",
    "crates/bitmule-mobile-ffi",
    "crates/fountain-demo",
    "crates/fountain-demo-v2",
    "crates/raptor-demo",
    "crates/bitmule-client-common",
    "crates/bitmule-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Sebastian K. <s3bk@qdat.net>", "Kenna <kenna@isecom.org>"]
repository = "https://github.com/s3bk/bitmule"

[workspace.dependencies]
tokio = { version = "1" }
tokio-stream = "*"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
rand_core = { version = "0.6", features = ["std"] }
rand = "0.8"
serde_json = "1"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
blake3 = "1"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.13"
sha2 = "0.11"
digest = "0.11"
hmac = "0.13"
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tokio-tungstenite = "0.30"
tungstenite = "0.30"
roaring = "0.10"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
hex = "0.4"
zip = { version = "2", default-features = false }
tempfile = "3"
walkdir = "2"
indexmap = "*"
futures = "*"
bitvec = "1.1.1"
zstd = "0.14"
postcard = "1.1.3"

# Release profile shared across the workspace. Strip debug + symbol
# tables so `cargo build --release` produces small binaries — critical
# for the Android .so files that ship inside the APK (unstripped
# release .so grows to ~200 MB per ABI because rustc keeps debug info
# by default; three ABIs × 200 MB explains an 800 MB APK).
#
# `strip = "symbols"` drops the symbol table + debug info; keeps the
# binary runnable but backtraces become opaque. `panic = "abort"`
# shrinks a further ~5-10% by removing landing pads but breaks
# std::panic::catch_unwind — leave it as unwind so the FFI's
# BitmuleError catch-all still works. `lto = "thin"` shrinks + speeds
# incrementally; full LTO is much slower link-time for marginal gain.
# `codegen-units = 1` is the size-optimal setting but slows single
# builds; comment out and add back only if release size becomes
# critical again.
[profile.release]
#strip = "symbols"
debug = 1
lto = "thin"

# local forks: str0m (data channel send buffer 1 MiB, not 128 KiB: vendor/str0m/src/sctp/mod.rs) and
# sctp-proto (Fx hashing in the payload queue, SACK delay settable: vendor/sctp-proto)
[patch.crates-io]
str0m = { path = "vendor/str0m" }
sctp-proto = { path = "vendor/sctp-proto" }
