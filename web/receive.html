<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>bitmule — receive</title>
    <link rel="icon" type="image/svg+xml" href="./bitmule.svg" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="./bitmule.svg" alt="" class="logo" aria-hidden="true" />
        <h1>bitmule</h1>
        <p class="tagline">receiving</p>
      </header>

      <section id="paste" class="session" hidden>
        <h2 class="session-title">Paste a bitmule link to receive</h2>
        <div class="session-link-row">
          <input
            id="paste-link"
            class="session-link"
            type="text"
            placeholder="https://…/receive.html#<session>"
            aria-label="paste share link"
          />
          <button id="paste-open" class="pick-btn" type="button">Open</button>
        </div>
        <div class="session-state">
          Or ask the sender to send you the link again with the session hash on the end.
        </div>
      </section>

      <section id="session" class="session" hidden aria-live="polite">
        <h2 class="session-title">Connected to sender</h2>
        <div class="session-state" id="session-state">connecting…</div>
        <div class="status">
          <div class="status-row">
            <span class="status-label">session</span>
            <span id="session-id" class="status-value pending">–</span>
          </div>
          <div class="status-row">
            <span class="status-label">server</span>
            <span id="server-status" class="status-value pending">connecting…</span>
          </div>
        </div>
        <button id="cancel-session" class="cancel-btn" type="button">
          Close
        </button>
      </section>

      <section id="queue" class="queue" aria-live="polite"></section>
    </main>
    <script type="module" src="./receive.js"></script>
  </body>
</html>
