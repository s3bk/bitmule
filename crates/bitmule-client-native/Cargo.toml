[package]
name = "bitmule-client-native"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
bitmule-core = { path = "../bitmule-core" }
bitmule-crypto = { path = "../bitmule-crypto" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
futures-util = "0.3"
bytes = { workspace = true }
# webpki-roots (Mozilla-bundled CA set) instead of native-roots so
# Android builds work — `rustls-native-certs` doesn't find the system
# trust store on Android's non-standard cert paths and every WS
# connect fails "no roots". Trade-off: user-added private CAs on the
# desktop won't be honored; bitmule.qdat.net is public HTTPS so fine.
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { workspace = true }
str0m = "0.23"
mdns = "3.0.0"
x25519-dalek.workspace = true
sha2.workspace = true
hkdf.workspace = true
zeroize = "1.9.0"
hmac = "0.12"
rand_core = { workspace = true, features = ["std"] }
aes-gcm = "0.10"
zstd = "0.13"
base64 = "0.22"
zip = { workspace = true }
tempfile = { workspace = true }
walkdir = { workspace = true }
indexmap = { workspace = true }
futures = { workspace = true }
biter = "*"


# version pins
dimpl = "0.7.3"
rcgen = "=0.14.7"
time = "=0.3.45"
icu_normalizer = "=2.0.1"
icu_provider = "=2.1.1"
icu_locale_core = "=2.1.1"
