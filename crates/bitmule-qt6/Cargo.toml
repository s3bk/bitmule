[package]
name = "bitmule-qt6"
edition = "2024"

[dependencies]
qmetaobject = "0.2"
tokio = { version = "1", features = ["full"] }
url = "2"
c_str_macro = "*"
bitmule = { path = "../bitmule" }
bitmule-account = { path = "../bitmule-account" }
bitmule-client-common = { path = "../bitmule-client-common" }
bitmule-client-native = { path = "../bitmule-client-native" }
bitmule-core = { path = "../bitmule-core" }
bitmule-crypto = { path = "../bitmule-crypto" }
anyhow = "1"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
walkdir = { workspace = true }
zip = { workspace = true, features = ["deflate", "zstd"] }
zeroize = "1.9"
getrandom = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# The account password, kept where the desktop keeps secrets: KWallet 6 on
# KDE, GNOME Keyring elsewhere — both speak the Secret Service API, which is
# D-Bus only (no libdbus: zbus speaks the wire protocol itself).
secret-service = { version = "4", features = ["rt-tokio-crypto-rust"] }
# Not called directly: `secret-service` leaves the D-Bus runtime to the
# application, and this one already runs tokio, so zbus must too.
zbus = { version = "4", default-features = false, features = ["tokio"] }

[build-dependencies]
# Compiles src/winicon.cpp: the one window-icon call Qt Quick doesn't expose.
cc = "1"
