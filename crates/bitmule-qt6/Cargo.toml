[package]
name = "bitmule-qt6"
edition = "2024"

[dependencies]
qmetaobject = "0.2"
tokio = { version = "1", features = ["full"] }
url = "0.2"
c_str_macro = "*"
bitmule-client-native = { path = "../bitmule-client-native" }
bitmule-crypto = { path = "../bitmule-crypto" }
anyhow = "1"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
