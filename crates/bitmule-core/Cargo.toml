[package]
name = "bitmule-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde_bytes = { workspace = true }
rand_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
blake3 = { workspace = true }
chacha20poly1305 = { workspace = true }
x25519-dalek = { workspace = true, features = ["static_secrets"] }
hkdf = { workspace = true }
sha2 = { workspace = true }
roaring = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
futures-util = "0.3"
xxhash-rust = { version = "*", features = ["xxh3"] }
bitflags = "*"
aes-gcm = "0.10"
zeroize = "1"
postcard = { version = "1", features = ["use-std"] }
bitmule-crypto = { path = "../bitmule-crypto" }
async_zip = { version = "0.0.19", features = ["zstd"] }
futures-lite = "2"

# Native-only: tokio filesystem + tempfile staging + compat shim.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "rt"] }
tokio-util = { version = "0.7", features = ["compat"] }
tempfile = "3"

# Wasm-only: web bindings for OPFS (async main-thread + sync worker-scope).
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["io-util"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Navigator",
    "StorageManager",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemWritableFileStream",
    "FileSystemGetFileOptions",
    "FileSystemCreateWritableOptions",
    "FileSystemSyncAccessHandle",
    "FileSystemReadWriteOptions",
    "File",
    "Blob",
]
