[package]
name = "raptor-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
raptorq = { git = "https://github.com/s3bk/raptorq", features = ["serde_support"] }
tokio-uring = { version = "0.5.0" }
tokio = { version = "*", features = ["macros", "rt-multi-thread", "time"] }
anyhow = "*"
clap = { version = "*", features = ["derive"] }
postcard = { version = "*", features = ["use-std"] }
futures = "*"
xxhash-rust = { version = "*", features = ["xxh3"] }
tokio-stream = "*"
serde = { version = "*", featues = ["derive"] }
serde_with = "*"
crossbeam = "*"

[target.'cfg(target_os="linux")'.dependencies]
linkme = "0.3"

[dev-dependencies]
