[package]
name = "bitmule"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Resumable, E2E-encrypted, WebRTC-first file transfer — CLI"
repository.workspace = true

[[bin]]
name = "bitmule"
path = "src/main.rs"

[dependencies]
bitmule-core = { path = "../bitmule-core" }
bitmule-client-native = { path = "../bitmule-client-native" }
clap = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
bytes = { workspace = true }
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { workspace = true }
rand = "0.8"
qrcode = { version = "0.14", default-features = false }
base64 = "0.22"
dirs = "5"
serde = { workspace = true }
serde_json = { workspace = true }
percent-encoding = "2"
