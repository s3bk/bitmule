[package]
name = "bitmule-client-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bitmule-core = { path = "../bitmule-core" }
bitmule-crypto = { path = "../bitmule-crypto" }
bitmule-client-common = { path = "../bitmule-client-common" }
bytes = { workspace = true }
postcard = { workspace = true }
anyhow = { workspace = true }
x25519-dalek = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { version = "1.26", features = ["js"] }
ruzstd = "0.9.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]
